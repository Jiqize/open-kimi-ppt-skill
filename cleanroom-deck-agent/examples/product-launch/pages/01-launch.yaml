id: launch-cover
type: cover
layout:
  type: cover
  options:
    margin: 0.82
    gap: 0.3
    titleHeight: 1.1
    bodyHeight: 0.8
background:
  color: background
elements:
  - id: title
    type: text
    slot: title
    text:
      value: Meet Atlas
      style: heading
      fontSize: 42
      color: foreground
      alignment: center
  - id: body
    type: text
    slot: body
    text:
      value: One workspace for turning customer context into confident decisions
      style: body
      fontSize: 20
      color: muted
      alignment: center
  - id: launch-signal
    type: line
    x: 3.4
    y: 4.45
    w: 3.2
    h: 0.08
    line:
      start: { x: 0, y: 0.5 }
      end: { x: 1, y: 0.5 }
      stroke: accent
      width: 3
      arrow: end
