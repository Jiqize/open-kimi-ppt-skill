id: page-01
type: elements
layout:
  type: free
background:
  color: background
elements:
  - id: card
    type: shape
    x: 0.6
    y: 0.6
    w: 8.8
    h: 4.8
    shape:
      kind: rectangle
      fill: surface
      stroke: accent
      radius: card
  - id: title
    type: text
    x: 1
    y: 1
    w: 4.4
    h: 0.8
    text:
      value: Editable Golden Deck
      style: heading
      fontSize: 26
      color: foreground
  - id: body
    type: text
    x: 1
    y: 2
    w: 4.4
    h: 1.2
    text:
      value: Text, image, shape, and line remain native PowerPoint objects.
      style: body
      color: muted
  - id: hero
    type: image
    x: 6
    y: 1
    w: 3
    h: 2.3
    source: ../media/hero.svg
    fit: cover
    alt: Abstract blue renderer geometry
  - id: direction
    type: line
    x: 1
    y: 4.2
    w: 8
    h: 0.8
    line:
      start:
        x: 0
        y: 0.5
      end:
        x: 1
        y: 0.5
      stroke: accent
      width: 2
      dash: solid
      arrow: end
